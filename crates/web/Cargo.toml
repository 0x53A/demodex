[package]
name = "demodex-web"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
anyhow = "1.0.104"
console_error_panic_hook = "0.1.7"
demodex-protocol = { version = "0.1.0", path = "../protocol" }
ewebsock = "0.8"
futures-util = "0.3.34"
gloo = { version = "0.12.0", features = ["timers", "futures"] }
js-sys = "0.3.105"
math-core = "0.8.2"
pulldown-cmark = { version = "0.13", default-features = false }
ractor = "0.15"
ractor_wormhole = { git = "https://github.com/0x53A/ractor-wormhole", rev = "766f4ed4b7fe5e411ea2ad2ca7b7cefbd372d917", version = "0.1.0", features = ["serde", "websocket_client_wasm"] }
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.26.1", features = ["v4", "js"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Document", "Location", "Storage", "StorageEvent", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlElement", "HtmlDialogElement", "NodeList", "Element", "Event", "EventTarget", "CustomEvent", "Url", "History", "PopStateEvent", "File", "FileList", "Blob", "ClipboardEvent", "DataTransfer", "KeyboardEvent", "PointerEvent", "DomRect"] }
yew = { version = "0.23.0", features = ["csr"] }
