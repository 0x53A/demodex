[package]
name = "demodex-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
demodex-protocol = { version = "0.1.0", path = "../protocol" }
futures-util = "0.3.34"
ractor = "0.15"
ractor_wormhole = { git = "https://github.com/0x53A/ractor-wormhole", rev = "766f4ed4b7fe5e411ea2ad2ca7b7cefbd372d917", version = "0.1.0", features = ["serde"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
