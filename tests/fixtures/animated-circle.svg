<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <title>Moving orange circle</title>
  <rect width="300" height="100" fill="#182635"/>
  <circle cx="40" cy="50" r="16" fill="#ef763b">
    <animate attributeName="cx" values="40;260;40" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
