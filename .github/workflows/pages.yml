name: Build and deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: nightly-2026-05-20
  TRUNK_VERSION: 0.21.14

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Cache Rust dependencies and Trunk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            target/rust-pwa
          key: pages-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-trunk-${{ env.TRUNK_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null || [ "$(trunk --version)" != "trunk $TRUNK_VERSION" ]; then
            cargo install trunk --version "$TRUNK_VERSION" --locked
          fi
      - name: Build static PWA
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: uv run tools/build-web.py --standalone --public-url "${PAGES_BASE_PATH}/" --dist web/.pages-dist
      - name: Install browser for smoke test
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Check installation and offline launch
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: uv run tests/pages.py --public-url "${PAGES_BASE_PATH}/"
      - name: Upload only the built frontend
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/.pages-dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
