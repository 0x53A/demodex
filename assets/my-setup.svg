<title>My actual Demodex setup</title>
<desc>A phone connects remotely to Demodex on my laptop. The laptop contains a browser, taxes folder, daemon, Codex app-server, host executor and two SSH executors. The SSH executors connect to a server and smartwatch; they run on the laptop, not on those remote devices.</desc>
